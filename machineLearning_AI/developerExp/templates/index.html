<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Engineer Experience Predictor</title>
  </head>
  <body>
    <h1>Upload Your Code File</h1>
    <form method="POST" enctype="multipart/form-data">
      <input type="file" name="file" accept=".js,.java">
      <button type="submit">Upload and Predict</button>
    </form>
    {% if prediction is not none %}
      <h2>Predicted Experience Level: {{ prediction }}</h2>
    {% endif %}
  </body>
</html>
