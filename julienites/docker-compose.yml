version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: julienites-db
    environment:
      POSTGRES_DB: julienites
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - julienites-network

  # Redis for caching and Celery
  redis:
    image: redis:7-alpine
    container_name: julienites-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - julienites-network

  # FastAPI Backend
  backend:
    build: ./backend
    container_name: julienites-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/julienites
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your-secret-key-change-in-production
      DEBUG: "true"
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - julienites-network

  # Celery Worker
  celery-worker:
    build: ./backend
    container_name: julienites-celery-worker
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/julienites
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.tasks.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    networks:
      - julienites-network

  # Celery Beat (for scheduled tasks)
  celery-beat:
    build: ./backend
    container_name: julienites-celery-beat
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/julienites
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    networks:
      - julienites-network

  # React Frontend
  frontend:
    build: ./frontend
    container_name: julienites-frontend
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://backend:8000/api
      REACT_APP_WS_URL: ws://backend:8000/ws
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - julienites-network

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: julienites-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - julienites-network

volumes:
  postgres_data:
  redis_data:

networks:
  julienites-network:
    driver: bridge